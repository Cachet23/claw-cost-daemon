[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claw-cost-daemon"
version = "0.1.0"
description = "Real-time AI API cost monitoring for Linux – intercept, attribute, analyse"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mitmproxy>=10.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.scripts]
claw-cost-daemon = "claw_cost_daemon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
